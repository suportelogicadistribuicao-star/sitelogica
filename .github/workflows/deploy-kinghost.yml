# Deploy do site institucional na hospedagem oficial (logicadistribuicao.com.br,
# KingHost), a cada push na branch `prod`.
#
# O que este repositório precisa ter no GitHub (Settings → Environments):
# um environment chamado `producao` com o secret
#   KINGHOST_FTP_PASSWORD   senha do usuário FTP abaixo (obrigatório)
# Host e usuário não são segredo e ficam aqui mesmo.
#
# Pré-requisito no painel da KingHost: Gerenciar FTP → Política de IPs →
# "Sem nenhum bloqueio". Com "Liberar acesso nacional" (o padrão) o runner
# do GitHub, que vem de IP estrangeiro, até loga, mas cai numa área vazia e
# sem permissão de escrita (erros 550 "No such file" / "Permission denied").
#
# Envio com lftp, instalado e executado direto no runner (sem action de
# terceiros tocando na senha). Antes era a SamKirkland/FTP-Deploy-Action, que
# falhava com ECONNRESET "data socket" (2026-10-17 e 2026-11-24): o servidor
# é ProFTPD e derrubava o canal de dados TLS aberto pela biblioteca Node da
# action. O lftp reaproveita a sessão TLS no canal de dados como o ProFTPD
# exige.
#
# Só FTPS (TLS explícito), com o certificado verificado, nunca FTP aberto:
#   - O certificado do servidor é *.kinghost.net, por isso a conexão usa o
#     nome do servidor (web-ded-185905a.kinghost.net), e não
#     ftp.logicadistribuicao.com.br (que é só um apelido DNS dele). Se a
#     KingHost migrar a conta de servidor, atualizar FTP_HOST: o nome novo
#     aparece em `nslookup ftp.logicadistribuicao.com.br`.
#   - O servidor não envia o certificado intermediário da GlobalSign, então
#     ele vai versionado em .github/certs/ e é somado às CAs do sistema.
#     Esse intermediário vale até 2029-06-23.
#
# dist/ vai inteiro para /www/, a pasta pública do domínio principal. Dentro
# de /www/ a KingHost também guarda uma pasta por subdomínio (/www/logicargv/
# é o Portal RGV, publicado pelo repositório Front-End-Froneri-Site; há
# outras, de outros projetos da empresa). Por isso o mirror roda SEM
# --delete: ele envia o que é novo ou mudou e nunca apaga nada no servidor.
#   - NÃO adicionar --delete no mirror de /www/: apagaria as pastas de todos
#     os subdomínios.
#   - NÃO criar em public/ uma pasta com o nome de um subdomínio.
#   - Consequência: arquivos que saem do dist/ (bundles antigos com hash,
#     restos do portal antigo como portal.html) ficam no servidor até serem
#     apagados à mão pelo FileZilla.

name: Build e Deploy (producao - logicadistribuicao.com.br)

on:
  push:
    branches:
      - prod
  workflow_dispatch:

# O token do GitHub neste job só lê o repositório.
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: producao

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci instala exatamente o package-lock.json (e falha se ele estiver
      # fora de sincronia): versão nova de dependência não chega à produção
      # sem passar pelo lockfile.
      - name: Instalar dependencias
        run: npm ci

      - name: Build do projeto
        run: npm run build

      - name: Instalar lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Enviar dist por FTPS (TLS explicito)
        env:
          FTP_HOST: web-ded-185905a.kinghost.net
          FTP_USER: logicadistribuicao
          # --env-password lê a senha desta variável: ela não aparece na
          # linha de comando nem no script do lftp.
          LFTP_PASSWORD: ${{ secrets.KINGHOST_FTP_PASSWORD }}
        run: |
          CA_BUNDLE="$RUNNER_TEMP/ca-bundle.pem"
          cat /etc/ssl/certs/ca-certificates.crt \
              .github/certs/globalsign-gcc-r46-alphassl-ca-2025.pem > "$CA_BUNDLE"

          lftp <<EOF
          set cmd:fail-exit yes
          set dns:order "inet"
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ftp:passive-mode yes
          set ssl:verify-certificate yes
          set ssl:check-hostname yes
          set ssl:ca-file "$CA_BUNDLE"
          open --env-password -u "$FTP_USER" "$FTP_HOST"
          mirror --reverse --verbose --no-perms ./dist/ /www/
          bye
          EOF
